spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bootbank_card_db?currentSchema=bootbank_card_db
    username: ${DB_USERNAME:bootbank_card}
    password: ${DB_PASSWORD:dev12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: bootbank_card_db


  liquibase:
    enabled: true