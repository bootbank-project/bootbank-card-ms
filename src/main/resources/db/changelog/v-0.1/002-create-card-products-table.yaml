              - column: { name: created_date, valueDate: now() }
              - column: { name: updated_date, valueDate: now() }
        - insert:
            tableName: card_products
            columns:
              - column: { name: id, valueSequenceNext: card_products_seq }
              - column: { name: code, value: PREMIUM_CREDIT }
