databaseChangeLog:
  - changeSet:
      id: 001-create-user-cards-table
      author: bootbank
      comment: "Creates the user_cards table for the User entity (card record)"
      changes:
        - createTable:
            tableName: user_cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_cif
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_user_cards_client_cif
              - column:
                  name: client_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: client_lastname
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: card_product_code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: card_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_user_cards_card_number
              - column:
                  name: expiry_date
                  type: VARCHAR(5)
                  constraints:
                    nullable: false
              - column:
                  name: card_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: credit_limit
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: used_limit
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
