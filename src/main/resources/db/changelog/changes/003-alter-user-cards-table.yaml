databaseChangeLog:
  - changeSet:
      id: 003-drop-unique-client-cif
      author: bootbank
      comment: "Drops the unique constraint on client_cif to allow a customer to hold multiple cards"
      changes:
        - dropUniqueConstraint:
            tableName: user_cards
            constraintName: uq_user_cards_client_cif

  - changeSet:
      id: 003-make-credit-used-limit-nullable
      author: bootbank
      comment: "Makes credit_limit and used_limit nullable to support debit cards (no credit limit)"
      changes:
        - dropNotNullConstraint:
            tableName: user_cards
            columnName: credit_limit
            columnDataType: DECIMAL(15, 2)
        - dropNotNullConstraint:
            tableName: user_cards
            columnName: used_limit
            columnDataType: DECIMAL(15, 2)
