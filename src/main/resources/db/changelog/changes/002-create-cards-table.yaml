databaseChangeLog:
  - changeSet:
      id: 002-create-cards-sequence
      author: bootbank
      comment: "Creates the sequence for the cards table (used by GenerationType.AUTO)"
      changes:
        - createSequence:
            sequenceName: cards_seq
            startValue: 1
            incrementBy: 50

  - changeSet:
      id: 002-create-cards-table
      author: bootbank
      comment: "Creates the cards table for the Card entity (card product reference)"
      changes:
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_cards_code
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
